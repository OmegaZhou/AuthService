# Shared authentication template. Replace placeholders
# in a private copy before validation. This file is not a runnable credential set.
server:
  address: 'tcp://127.0.0.1:9091/auth'
log:
  level: info
authentication_backend:
  password_reset:
    disable: true
  file:
    path: '/var/lib/gpt-plugin-oauth/users.yml'
    watch: true
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
access_control:
  default_policy: deny
  rules:
    - domain: 'auth.example.com'
      policy: one_factor
      subject: 'group:plugin-users'
session:
  secret: 'REPLACE_WITH_RANDOM_SESSION_SECRET'
  cookies:
    - domain: 'example.com'
      authelia_url: 'https://auth.example.com/auth'
storage:
  encryption_key: 'REPLACE_WITH_RANDOM_STORAGE_KEY'
  local:
    path: '/var/lib/gpt-plugin-oauth/database.sqlite3'
notifier:
  filesystem:
    filename: '/var/lib/gpt-plugin-oauth/notifications.txt'
identity_providers:
  oidc:
    hmac_secret: 'REPLACE_WITH_RANDOM_OAUTH_SECRET'
    jwks:
      - algorithm: RS256
        use: sig
        key: |
          REPLACE_WITH_PRIVATE_RSA_KEY
    lifespans:
      access_token: '1 hour'
      refresh_token: '30 days'
    scopes:
      mail.read:
        claims: []
      mail.write:
        claims: []
      notes.read:
        claims: []
      notes.write:
        claims: []
    authorization_policies:
      plugin_users:
        default_policy: deny
        rules:
          - policy: one_factor
            subject: 'group:plugin-users'
    clients:
      - client_id: gptmail-chatgpt
        client_name: GptMail
        public: true
        authorization_policy: plugin_users
        require_pkce: true
        pkce_challenge_method: S256
        token_endpoint_auth_method: none
        redirect_uris:
          - 'https://chatgpt.com/REPLACE_WITH_EXACT_HOST_CALLBACK'
        scopes: [openid, profile, email, offline_access, mail.read, mail.write]
        grant_types: [authorization_code, refresh_token]
        response_types: [code]
        audience:
          - 'https://mail.example.com/mail-mcp'
        requested_audience_mode: explicit
        access_token_signed_response_alg: RS256
      - client_id: notes-chatgpt
        client_name: Notes plugin
        public: true
        authorization_policy: plugin_users
        require_pkce: true
        pkce_challenge_method: S256
        token_endpoint_auth_method: none
        redirect_uris:
          - 'https://chatgpt.com/REPLACE_WITH_EXACT_HOST_CALLBACK'
        scopes: [openid, profile, email, offline_access, notes.read, notes.write]
        grant_types: [authorization_code, refresh_token]
        response_types: [code]
        audience:
          - 'https://notes.example.com/mcp'
        requested_audience_mode: explicit
        access_token_signed_response_alg: RS256
